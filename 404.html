<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Кажется тут пусто  - Пока этой страницы нет или она в разработке, а может ты опечтался</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #d2b48c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { color: #e67e22; font-size: 50px; margin-bottom: 10px; }
        p { font-size: 18px; max-width: 500px; margin-bottom: 30px; }
        
        .back-btn {
            display: inline-block;
            padding: 12px 30px;
            border: 2px solid #e67e22;
            color: #e67e22;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: #e67e22;
            color: #fff;
        }
        .error-img {
            max-width: 350px;
            margin-bottom: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <img src="/not.png" alt="Rometto Error" class="error-img">
    
    <h1>Ой кажется тут пусто...</h1>
    <p>Похоже, вы забрели на закрытую территорию или страница еще находится в разработке  (у Рометто всё-таки лапки) или ты опечатался.</p>

    <a href="/" class="back-btn">Вернуться к листу</a>

</body>
</html>
