    <style>
        /* === ВСЕ ТВОИ СТАРЫЕ СТИЛИ (оставлены без изменений) === */
        @font-face { font-family: 'LionKing'; src: url('lion_king.ttf') format('truetype'); }
        body { cursor: url('cursor_busy.png') 12 12, auto; font-family: Arial, Helvetica, sans-serif; background: #0f0f0f; color: #d2b48c; margin: 0; padding: 20px; line-height: 1.6; display: flex; flex-direction: column; align-items: center; user-select: text; }
        .no-scroll { overflow: hidden; height: 100vh; }
        /* ... (все твои классы .lang-switch, .nav-btn, .table, .hunting-block и т.д. — полностью сохранены) ... */

        /* ====================== НОВЫЕ СТИЛИ ====================== */
        .toc { position: sticky; top: 10px; z-index: 1000; width: 100%; max-width: 1100px; margin: 15px 0 25px; background: rgba(230,126,34,0.1); border: 1px solid #e67e22; border-radius: 8px; padding: 12px; }
        .toc ul { display: flex; flex-wrap: wrap; gap: 12px; list-style: none; padding: 0; margin: 0; justify-content: center; }
        .toc li { flex: 1; min-width: 220px; }
        .toc a { display: block; padding: 12px 18px; background: #1f1f1f; border: 1px solid #e67e22; color: #e67e22; text-align: center; border-radius: 6px; font-weight: bold; transition: all 0.2s; }
        .toc a:hover { background: #e67e22; color: #fff; transform: translateY(-2px); }

        /* Кнопка "Наверх" */
        .back-to-top {
            position: fixed; bottom: 25px; right: 25px; z-index: 9999;
            background: #e67e22; color: #000; width: 52px; height: 52px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; box-shadow: 0 4px 15px rgba(230,126,34,0.5);
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .back-to-top.show { opacity: 1; visibility: visible; }

        /* Кнопка "Меню" на мобильных */
        .hamburger {
            position: fixed; top: 22px; left: 20px; z-index: 1001;
            background: rgba(230,126,34,0.15); border: 1px solid #e67e22; color: #e67e22;
            width: 48px; height: 48px; border-radius: 50%; display: none;
            align-items: center; justify-content: center; font-size: 26px; cursor: pointer;
        }
        @media (max-width: 768px) { .hamburger { display: flex; } .toc { position: static; top: auto; } }

        /* Остальные стили (particle, hell-mode, faq и т.д.) — остались как были */
        .particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; opacity: 0.55; }
        .toggle-particles { position: fixed; top: 72px; right: 20px; z-index: 1000; ... } /* твой стиль */
        .hell-mode { ... } /* твой стиль */
    </style>

<body class="no-scroll">

    <!-- Age Gate и весь твой контент (таблицы, изображения, FAQ и т.д.) — полностью без изменений -->

    <!-- Кнопка "Меню" (только на мобильных) -->
    <div class="hamburger" id="hamburgerBtn">☰</div>

    <!-- Кнопка "Наверх" -->
    <button id="backToTop" class="back-to-top">↑</button>

    <div id="page-content">
        <!-- ... Весь твой HTML (lang-switch, lightbox, h1, TOC, таблицы, footer и т.д.) ... -->
        <!-- Аудио -->
        <audio id="hellMusic" src="/assets/Lion_The_Prince_of_Hell_(Remastered).mp3" preload="auto" loop></audio>
    </div>

    <script>
        // === Весь твой предыдущий JS (age-gate, lightbox, particle, easter egg, faq и т.д.) ===
        // ... (я оставил его полностью) ...

        // ====================== НОВЫЕ ФИЧИ ======================

        // 1. Кнопка "Наверх"
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                backToTop.classList.add('show');
            } else {
                backToTop.classList.remove('show');
            }
        });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 2. Мобильное меню (гамбургер)
        const hamburger = document.getElementById('hamburgerBtn');
        const tocContainer = document.getElementById('toc-container');

        hamburger.addEventListener('click', () => {
            tocContainer.style.display = tocContainer.style.display === 'block' ? 'none' : 'block';
        });

        // На ПК TOC всегда visible и sticky (уже настроено в CSS)

        // Запуск
        window.addEventListener('load', () => {
            // ... твой предыдущий код (resizeCanvas, animateParticles, generateTOC и т.д.)
        });
    </script>
</body>
