<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Упс... Пусто!</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #d2b48c;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .protected-blur { filter: blur(150px); opacity: 0; }
        
        img { 
            max-width: 500px; 
            margin-bottom: 20px; 
            border-radius: 10px;
        }

        h1 { color: #fff; text-transform: uppercase; margin: 10px 0; }
        p { font-size: 18px; margin-bottom: 30px; }

        .back-btn {
            padding: 12px 30px;
            border: 2px solid #e67e22;
            color: #e67e22;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            transition: 0.3s;
        }
        .back-btn:hover { background: #e67e22; color: #fff; }
    </style>
</head>
<body oncontextmenu="return false;">

    <img src="not.png" alt="Упс... Пусто">

    <h1>Упс... Пусто!</h1>
    <p>Здесь пока ничего нет, может попробуешь потом зайти сюда?</p>

    <a href="index.html" class="back-btn">Вернуться к листу</a>

    <script>
        const body = document.body;
        function setBlur(on) {
            if (on) body.classList.add('protected-blur');
            else body.classList.remove('protected-blur');
        }
        window.addEventListener('blur', () => setBlur(true));
        window.addEventListener('focus', () => setBlur(false));
        document.addEventListener('visibilitychange', () => document.hidden ? setBlur(true) : setBlur(false));
        
        window.addEventListener('keyup', (e) => {
            if (e.key === "PrintScreen" || e.keyCode === 44) {
                setBlur(true);
                setTimeout(() => setBlur(false), 3000);
            }
        });
    </script>
</body>
</html>
